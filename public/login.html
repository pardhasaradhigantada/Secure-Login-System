<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure Login System - Authenticate with email/username and hashed password credentials.">
  <title>Sign In - Secure Login System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Ambient Background Glow -->
  <div class="ambient-glow">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
  </div>

  <div class="page-wrapper">
    <!-- Top Header -->
    <header class="app-header">
      <a href="/" class="brand-badge">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <span>AuthShield</span>
      </a>
      <div class="brand-status-tag">
        <span class="status-dot"></span>
        <span>Bcrypt & SQLite Protected</span>
      </div>
    </header>

    <!-- Main Login Section -->
    <main class="main-content">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Welcome Back</h1>
          <p>Sign in using your username or registered email address</p>
        </div>

        <!-- Notification Banner -->
        <div id="alert-box" class="alert-box" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span id="alert-text"></span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form" novalidate>
          <!-- Username / Email Input -->
          <div class="form-group">
            <label for="identifier" class="form-label">Username or Email</label>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </span>
              <input
                type="text"
                id="identifier"
                name="identifier"
                class="input-field"
                placeholder="e.g. john_doe or john@example.com"
                required
                autocomplete="username"
                autofocus
              >
            </div>
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <div class="form-label">
              <label for="password">Password</label>
            </div>
            <div class="input-wrapper">
              <span class="input-icon-left">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                class="input-field has-right-icon"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              >
              <button type="button" id="toggle-password" class="input-toggle-btn" aria-label="Toggle password visibility">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Form Options: Remember Me -->
          <div class="form-options-row">
            <label class="checkbox-label" for="rememberMe">
              <input type="checkbox" id="rememberMe" name="rememberMe">
              <span>Remember me for 30 days</span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submit-btn" class="btn-primary">
            <span class="btn-text">Sign In</span>
            <div class="spinner"></div>
          </button>
        </form>

        <!-- Card Footer -->
        <div class="auth-footer">
          Don't have an account yet? <a href="/register.html" class="auth-link">Create an account</a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Secure Login System &bull; Node.js, Express, SQLite, bcrypt &amp; express-session</p>
    </footer>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
